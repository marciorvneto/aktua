name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  release:
    needs: [test-linux, test-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the Linux build
        uses: actions/download-artifact@v4
        with:
          name: aktua-linux
          path: aktua-linux/

      - name: Download the Windows build
        uses: actions/download-artifact@v4
        with:
          name: aktua-windows
          path: aktua-windows/

      - name: Check out the code
        uses: actions/checkout@v4
        with:
          path: src/

      - name: Package
        run: |
          mkdir -p dist/aktua-linux-x86_64 dist/aktua-windows-x86_64

          cp -r aktua-linux/aktua aktua-linux/libs src/examples src/LICENSE.md src/README.md \
            dist/aktua-linux-x86_64/
          cp src/platform-specific/linux/COPYRIGHT.musl \
            dist/aktua-linux-x86_64/THIRD_PARTY_LICENSES.txt
          chmod +x dist/aktua-linux-x86_64/aktua

          cp -r aktua-windows/aktua.exe aktua-windows/libs src/examples src/LICENSE.md src/README.md \
            dist/aktua-windows-x86_64/
          cp src/platform-specific/windows/COPYING.MinGW-w64-runtime.txt \
            dist/aktua-windows-x86_64/THIRD_PARTY_LICENSES.txt

          cd dist
          tar -czf aktua-linux-x86_64.tar.gz aktua-linux-x86_64
          zip -r aktua-windows-x86_64.zip aktua-windows-x86_64
          ls -l

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ github.ref_name }}
          gh release create "$V" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "Aktua $V" \
            --generate-notes \
            dist/aktua-linux-x86_64.tar.gz \
            dist/aktua-windows-x86_64.zip

  build-linux:
    runs-on: ubuntu-latest
    container: alpine:3.22

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install make, musl, gcc, etc
        run: apk add --no-cache build-base

      - name: Build
        run: make aktua BUILD=release STATIC=1

      - name: Upload the generated executable as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: aktua-linux
          path: |
            build/aktua
            build/libs/

  build-windows:
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install the MinGW-w64 UCRT cross-compiler
        run: apt-get update && apt-get install -y make gcc-mingw-w64-ucrt64

      - name: Build
        run: make aktua PLATFORM=windows BUILD=release

      - name: Upload the generated executable as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: aktua-windows
          path: |
            build/aktua.exe
            build/libs/

  test-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    env:
      AKTUA_NO_VIEWER: 1

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Download the Linux build
        uses: actions/download-artifact@v4
        with:
          name: aktua-linux
          path: build/

      - name: Run tests
        run: |
          chmod +x ./build/aktua
          make test TEST_DEPS=

  test-windows:
    needs: build-windows
    runs-on: windows-latest
    env:
      AKTUA_NO_VIEWER: 1

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Download the Windows build
        uses: actions/download-artifact@v4
        with:
          name: aktua-windows
          path: build/

      - name: Install make
        run: choco install make --no-progress

      - name: Run tests
        # test-svg runs on Linux only: C libraries round printf ties differently
        run: make test-scripts test-errors test-repl PLATFORM=windows TEST_DEPS=

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build
        run: make aktua

      - name: Run tests
        run: make test
