name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  release:
    needs: [test-linux, test-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download the Linux build
        uses: actions/download-artifact@v4
        with:
          name: aktua-linux
          path: aktua-linux/

      - name: Download the Windows build
        uses: actions/download-artifact@v4
        with:
          name: aktua-windows
          path: aktua-windows/

  build-linux:
    runs-on: ubuntu-latest
    container: alpine:3.22

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install make, musl, gcc, etc
        run: apk add --no-cache build-base

      - name: Build
        run: make aktua BUILD=release STATIC=1

      - name: Upload the generated executable as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: aktua-linux
          path: |
            build/aktua
            build/libs/

  build-windows:
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install the MinGW-w64 UCRT cross-compiler
        run: apt-get update && apt-get install -y make gcc-mingw-w64-ucrt64

      - name: Build
        run: make aktua PLATFORM=windows BUILD=release

      - name: Upload the generated executable as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: aktua-windows
          path: |
            build/aktua.exe
            build/libs/

  test-linux:
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Download the Linux build
        uses: actions/download-artifact@v4
        with:
          name: aktua-linux
          path: build/

      - name: Run tests
        run: |
          chmod +x ./build/aktua
          for f in test/*.akt examples/*.akt; do
            ./build/aktua "$f" > /dev/null || { echo "FAILED: $f"; exit 1; }
          done
          echo "All tests passed"

  test-windows:
    needs: build-windows
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Download the Windows build
        uses: actions/download-artifact@v4
        with:
          name: aktua-windows
          path: build/

      - name: Run tests
        run: |
          for f in test/*.akt examples/*.akt; do
            ./build/aktua.exe "$f" > /dev/null || { echo "FAILED: $f"; exit 1; }
          done
          echo "All tests passed"

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build
        run: make aktua

      - name: Run tests
        run: make test
